[paths]
service_name = smartchannel
tx_mount_point = /SMARTCHANNEL/TX
rx_mount_point = /SMARTCHANNEL/RX
session_config_path = /var/smartchannel/SessionConfig

[log_formats]
success_log_format = file {filename} transferred successfully in {time} ms
failure_log_format = file {filename} transfer failed, error: {error}

